<div id="pagecontent">
    <div id="box5" class="si-step2-header-width">
        <h3><span class="fancy" style="color:#ffffff">Member Sign-in</span></h3>
        <div class="content" id="round1" style="padding-left: 1px">
            <div class="newformholdersignup">
                <div class="rightBoxes">
                    <div class="notyetmember">
                        <a class="lozenge2" href="<%= it.signupHref %>" rel="nofollow"><span>Go to Quick Sign-up</span></a>
                    </div>
                </div>
                <div class="welcomeback">&nbsp;</div>
                <form action="/member/signin" method="post" id="sign_in">
                    <div class="si-login-form-cnt" style="float: none">
                        <input type="hidden" name="action" value="processSignIn" />
                        <input type="hidden" name="promotion" value="" />
                        <input type="hidden" name="next" value="<%= it.next %>" />
<%~ it.formError %>
                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 32px">
                            <div class="si-login-form-item-left">Username:&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-textfield-cnt">
                                    <input type="text" name="signInUsername" value="" class="si-login-form-textfield" />
                                                                    </div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>

                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 38px">
                            <div class="si-login-form-item-left">Password:&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-textfield-cnt">
                                    <input type="password" name="signInPassword" value="" class="si-login-form-textfield" />
                                                                    </div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 15px">
                            <div class="si-login-form-item-left">&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-rememberme-cb"><input type="checkbox" name="remember_me" id="remember_me" value="1" /></div>
                                <div class="si-login-form-rememberme-text si-segapass-text-color"><label for="remember_me">Remember me on this computer</label></div>
                                <div class="clear">&nbsp;</div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="float: none; padding-top: 15px">
                            <div class="si-login-form-item-left">&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="cf-turnstile" data-sitekey="<%= it.turnstileSitekey %>" data-action="<%= it.turnstileAction %>" data-theme="light"></div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="padding-top: 15px; float: none">
                            <div class="si-login-form-item-left">&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <span class="button"><button type="submit" name="submit" value="submit">Sign-in</button></span>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                    </div>
                </form>
                            <div style="height: 90px">&nbsp;</div>
                      </div>
    </div>
  </div>
</div>
<div style="clear:both"></div>
</div>
