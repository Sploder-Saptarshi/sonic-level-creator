
<div id="pagecontent">
    <div id="box5" class="si-step2-header-width">
        <h3><span class="fancy" style="color:#ffffff">Member Sign-up</span></h3>
        <div class="content" id="round1" style="padding-left: 1px">
            <div class="newformholdersignup">
                <div class="welcomeback">&nbsp;</div>
                <form action="/member/signup" method="post" id="sign_up">
                    <div class="si-login-form-cnt" style="float: none">
                        <input type="hidden" name="action" value="processSignUp" />
                        <input type="hidden" name="promotion" value="" />
                        <input type="hidden" name="next" value="<%= it.next %>" />
<%~ it.formError %>
                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 32px">
                            <div class="si-login-form-item-left">Username:&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-textfield-cnt">
                                    <input type="text" name="username" value="" class="si-login-form-textfield" />
                                </div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 32px">
                            <div class="si-login-form-item-left">Password:&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-textfield-cnt">
                                    <input type="password" name="password" value="" class="si-login-form-textfield" />
                                </div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="float: none; padding: 0; height: 32px">
                            <div class="si-login-form-item-left">Confirm:&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <div class="si-login-form-textfield-cnt">
                                    <input type="password" name="confirmPassword" value="" class="si-login-form-textfield" />
                                </div>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="padding-top: 15px; float: none">
                            <div class="si-login-form-item-left">&nbsp;</div>
                            <div class="si-login-form-item-right">
                                <span class="button"><button type="submit" name="submit" value="submit">Sign-up</button></span>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                        <div class="si-login-form-item-cnt" style="padding-top: 10px; float: none">
                            <div class="si-login-form-item-left">&nbsp;</div>
                            <div class="si-login-form-item-right">
                                Already have an account? <a href="<%= it.signinHref %>" rel="nofollow">Sign in</a>
                            </div>
                            <div class="clear">&nbsp;</div>
                        </div>
                    </div>
                </form>
                            <div style="height: 90px">&nbsp;</div>
                      </div>
    </div>
  </div>
</div>
<div style="clear:both"></div>
</div>
