            function show_game()
            {
                if(swfobject.hasFlashPlayerVersion("6.0.65")) {//they have flash
                    var flashvars = {
                    id: "<%= it.sessionId %>",territory: "<%= it.territory %>",enableSkip: 1,levelid: <%~ it.levelIdJs %><%~ it.zoneOneFrag %>,contentSWF: "<%= it.contentSwf %>"                    };
                    var params = {
                        menu: "false"
                    };
                    swfobject.embedSWF("<%~ it.playerSwf %>",
                                       "gameswf",
                                       "<%= it.gameWidth %>",
                                       "<%= it.gameHeight %>",
                                       "9.0.0",
                                       "../swf/expressInstall.swf",
                                       flashvars,
                                       params);
                } else {//they dont have flash
                    swfobject.createCSS("#gameswf div#fl", "display:block;");
                    swfobject.createCSS("#gameswf div#preroll_mpu", "display:none;");
                }
            }
